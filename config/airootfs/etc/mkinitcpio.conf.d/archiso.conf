# Hooks the live system needs to find and mount its own root filesystem.
# Without the archiso hooks the initramfs cannot locate the squashfs on the
# boot medium. Same list as archiso's releng profile.
# memdisk is deliberately absent: Jupiter only boots from UEFI media, not
# from a memdisk/PXE chainload.
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
